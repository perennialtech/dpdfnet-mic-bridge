[package]
name = "dpdfnet-mic-bridge-native-audio"
version = "0.2.0"
edition = "2021"
publish = false

[lib]
name = "_native_audio"
crate-type = ["cdylib"]

[dependencies]
libc = "0.2"
numpy = "0.30"
pyo3 = { version = "0.30", features = ["extension-module"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Media_Multimedia",
    "Win32_System_Threading",
] }

[build-dependencies]
pkg-config = "0.3"
vcpkg = "0.2"

[profile.release]
codegen-units = 1
lto = true
