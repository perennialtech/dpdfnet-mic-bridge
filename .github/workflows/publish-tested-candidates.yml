# Publish previously verified cross-platform CI packages without rebuilding them.
# Only use this if application/build inputs match the tagged version.
name: Publish tested packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string
      successful_run_id:
        description: Completed successful Test and package workflow run ID
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Verify tag, successful CI run, and identical build inputs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          RUN_ID: ${{ inputs.successful_run_id }}
        run: |
          set -euo pipefail
          test "$TAG" = "v$(sed -n 's/^version = "\([^" ]*\)"/\1/p' pyproject.toml | head -1)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$TAG^{commit}")"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .conclusion)" = success
          candidate_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .head_sha)"
          # The release commit may differ in documentation and CI configuration only.
          git diff --exit-code "$candidate_sha" HEAD -- . \
            ':(exclude).github' ':(exclude)README.md' ':(exclude)CONTRIBUTING.md' \
            ':(exclude)packaging/sign_windows.ps1' ':(exclude)packaging/prepare_release_sources.py'
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite." >&2
            exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: ${{ inputs.successful_run_id }}
          github-token: ${{ github.token }}
          pattern: package-*
          merge-multiple: true
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: ${{ inputs.successful_run_id }}
          github-token: ${{ github.token }}
          pattern: sources-and-notices-*
          path: source-materials
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.13.4"
      - run: uv python install 3.12.13
      - name: Assemble source materials and SHA-256 checksums
        run: |
          if ! command -v zstd >/dev/null; then sudo apt-get update && sudo apt-get install -y zstd; fi
          uv run --no-project --python 3.12.13 python packaging/prepare_release_sources.py
          uv run --no-project --python 3.12.13 python packaging/checksums.py
          ls -lh release
          (cd release && sha256sum --check SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          RUN_ID: ${{ inputs.successful_run_id }}
        run: |
          gh release create "$TAG" release/* --verify-tag --title "DPDFNet Mic Bridge ${TAG#v}" \
            --notes "Windows x64 installer (unsigned) and Linux x86-64 AppImage include the default CPU model. Windows may display an unknown publisher / SmartScreen warning. Windows requires separately installed VB-CABLE; Linux requires a PulseAudio-compatible desktop session. These binaries were built and verified by successful CI run $RUN_ID against the same application and packaging inputs as this tag. CI tests do not establish physical microphone or every desktop compatibility. Source archives, notices, and SHA-256 checksums are attached."
