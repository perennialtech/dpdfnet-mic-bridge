name: bundle

on:
  push:
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PortAudio
        run: |
          vcpkg install portaudio:x64-windows

      - name: Build bundle
        shell: pwsh
        run: |
          uv sync --group bundle
          uv run maturin develop --release
          $env:PORTAUDIO_DLL="$env:VCPKG_ROOT\installed\x64-windows\bin\portaudio.dll"
          uv run pyinstaller --clean -y packaging/dpdfnet-mic-bridge.spec

      - name: Zip bundle
        shell: pwsh
        run: |
          Compress-Archive -Path dist\dpdfnet-mic-bridge -DestinationPath dpdfnet-mic-bridge-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dpdfnet-mic-bridge-windows-x64.zip

  linux:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config portaudio19-dev libportaudio2

      - name: Build bundle
        run: |
          uv sync --group bundle
          uv run maturin develop --release
          export PORTAUDIO_SO=/usr/lib/x86_64-linux-gnu/libportaudio.so.2
          uv run pyinstaller --clean -y packaging/dpdfnet-mic-bridge.spec

      - name: Archive bundle
        run: |
          tar --zstd -cf dpdfnet-mic-bridge-linux-x64.tar.zst -C dist dpdfnet-mic-bridge

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dpdfnet-mic-bridge-linux-x64.tar.zst
