name: Test and package

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Superseded branch and PR builds should not occupy runners or cache bandwidth.
# Never cancel a tagged release build.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}

defaults:
  run:
    shell: bash

env:
  UV_PYTHON: "3.12.13"
  UV_PYTHON_INSTALL_MIRROR: https://github.com/astral-sh/python-build-standalone/releases/download
  RUSTUP_TOOLCHAIN: "1.96.0"
  QT_QPA_PLATFORM: offscreen

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/build-environment
      - run: uv sync --locked
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync python -c "import dpdfnet_mic_bridge; import dpdfnet_mic_bridge.app"
      - run: uv run --no-sync python -m dpdfnet_mic_bridge --help
      - run: uv run --no-sync ruff check src tests packaging
      - run: uv run --no-sync black --check src tests packaging

  package:
    # Packaging and testing have no shared artifacts. Run concurrently, but
    # require *both* to succeed before publishing a tagged release.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/build-environment
      - name: Cache verified Qt source archives (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            build/third-party-sources/qt-everywhere-src-*.tar.xz
            build/third-party-sources/pyside-setup-everywhere-src-*.tar.xz
          key: qt-sources-linux-v1-${{ hashFiles('packaging/qt-sources.json') }}
      - name: Cache extracted Qt license notices (Windows)
        if: runner.os == 'Windows'
        id: qt-notices
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: build/qt-notices
          key: qt-notices-windows-v1-${{ hashFiles('packaging/qt-sources.json', 'packaging/stage_qt_notices.py') }}
      - name: Validate tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: uv run --no-project python -c 'import os,tomllib; v=tomllib.load(open("pyproject.toml","rb"))["project"]["version"]; assert os.environ["GITHUB_REF_NAME"] == "v" + v'
      - name: Stage pinned model and corresponding Qt sources
        env:
          QT_NOTICES_CACHE_HIT: ${{ steps.qt-notices.outputs.cache-hit }}
        run: |
          uv run --no-project python packaging/stage_model.py
          if [[ "$RUNNER_OS" == Windows && "$QT_NOTICES_CACHE_HIT" == true ]]; then
            # Qt sources are retained once, in the Linux source artifact.
            mkdir -p build/third-party-sources
            cp packaging/qt-sources.json build/third-party-sources/qt-sources.json
          else
            uv run --no-project python packaging/stage_qt_notices.py
          fi
          if [[ "$RUNNER_OS" == Windows ]]; then
            # Notices are still bundled for Windows, but source archives are
            # identical to the checksum-verified copies retained on Linux.
            rm -f build/third-party-sources/{qt-everywhere-src,pyside-setup-everywhere-src}-*.tar.xz
          fi
      - name: Install packaging dependencies
        run: uv sync --locked --no-dev --group bundle --no-editable
      - name: Verify wheel contents
        run: |
          uv build --wheel --out-dir build/release-wheel
          uv run --no-sync python packaging/check_wheel.py build/release-wheel
      - name: Stage Linux audio clients
        if: runner.os == 'Linux'
        run: uv run --no-sync python packaging/stage_linux_clients.py
      - name: Collect notices and build folder bundle
        run: |
          uv run --no-sync python packaging/stage_notices.py
          uv run --no-sync python -m PyInstaller --clean --noconfirm packaging/dpdfnet-mic-bridge.spec
      - name: Retain Rust dependency source
        run: cargo vendor --locked --manifest-path rust/native_audio/Cargo.toml build/third-party-sources/rust-crates
      - name: Retain matching Ubuntu client-library sources
        if: runner.os == 'Linux'
        shell: bash
        # A degraded Ubuntu mirror previously stalled this step for 144 minutes.
        timeout-minutes: 20
        run: |
          sed -n 's/^deb /deb-src /p' /etc/apt/sources.list | sudo tee /etc/apt/sources.list.d/dpdfnet-source-packages.list
          sudo apt-get update
          uv run --no-sync python packaging/stage_native_sources.py
      - name: Frozen Linux checks with empty caches and no network
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dist/dpdfnet-mic-bridge/dpdfnet-mic-bridge --help
          unshare --user --map-root-user --net env XDG_CACHE_HOME="$RUNNER_TEMP/empty-cache" dist/dpdfnet-mic-bridge/dpdfnet-mic-bridge self-test
          dist/dpdfnet-mic-bridge/dpdfnet-mic-bridge _desktop-ui-test
      - name: Frozen Windows checks with empty caches
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "empty-cache"
          & dist\dpdfnet-mic-bridge\dpdfnet-mic-bridge-cli.exe --help
          if ($LASTEXITCODE -ne 0) { throw "Frozen help failed" }
          & dist\dpdfnet-mic-bridge\dpdfnet-mic-bridge-cli.exe self-test
          if ($LASTEXITCODE -ne 0) { throw "Frozen inference failed" }
          & dist\dpdfnet-mic-bridge\dpdfnet-mic-bridge-cli.exe _desktop-ui-test
          if ($LASTEXITCODE -ne 0) { throw "Frozen desktop failed" }
          $gui = Start-Process dist\dpdfnet-mic-bridge\dpdfnet-mic-bridge.exe -ArgumentList "_desktop-ui-test" -PassThru
          if (-not $gui.WaitForExit(30000)) { $gui.Kill(); throw "Windowed desktop smoke test timed out" }
          if ($gui.ExitCode -ne 0) { throw "Windowed desktop smoke test failed" }
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --version=6.6.1 --yes --no-progress --allow-downgrade
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          $version = uv run --no-sync python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($LASTEXITCODE -ne 0) { throw "Could not read the application version" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging/dpdfnet-mic-bridge.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
          $installer = (Get-ChildItem release/*-setup.exe).FullName
          ./packaging/check_windows_install.ps1 -Installer $installer
      - name: Build and test Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          uv run --no-sync python packaging/build_appimage.py
          APPIMAGE_EXTRACT_AND_RUN=1 release/*.AppImage --help
          unshare --user --map-root-user --net env APPIMAGE_EXTRACT_AND_RUN=1 XDG_CACHE_HOME="$RUNNER_TEMP/appimage-empty-cache" release/*.AppImage self-test
          APPIMAGE_EXTRACT_AND_RUN=1 release/*.AppImage _desktop-ui-test
      - name: Synthetic Linux audio integration test
        if: runner.os == 'Linux'
        shell: bash
        run: |
          pulseaudio --start --exit-idle-time=-1
          uv run --no-sync python packaging/audio_smoke.py dist/dpdfnet-mic-bridge/dpdfnet-mic-bridge
      - name: Upload candidate packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-${{ runner.os }}
          path: release/*
          if-no-files-found: error
      - name: Upload corresponding sources and notices
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sources-and-notices-${{ runner.os }}
          path: |
            build/third-party-sources/*
            build/notices/
          compression-level: 0
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, package]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.13.4"
      - run: uv python install "$UV_PYTHON"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: package-*
          merge-multiple: true
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: sources-and-notices-*
          path: source-materials
      - name: Prepare source materials and checksums
        run: |
          if ! command -v zstd >/dev/null; then sudo apt-get update && sudo apt-get install -y zstd; fi
          uv run --no-project python packaging/prepare_release_sources.py
          uv run --no-project python packaging/checksums.py
          (cd release && sha256sum --check SHA256SUMS)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "DPDFNet Mic Bridge ${GITHUB_REF_NAME#v}" --generate-notes --notes "Windows x64 installer (unsigned) and Linux x86-64 AppImage include the default CPU model. Windows may display SmartScreen warnings. VB-CABLE is a separate Windows prerequisite; Linux needs a PulseAudio-compatible desktop session. CI tests are not a substitute for real hardware compatibility testing. See CONTRIBUTING.md for licensing and verification information."
