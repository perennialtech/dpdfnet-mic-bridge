[project]
name = "dpdfnet-mic-bridge"
version = "0.1.0"
description = "Desktop DPDFNet microphone bridge for Windows and Linux"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "dpdfnet==0.6.0",
    "numba>=0.65", # dpdfnet pulls librosa which pulls an ancient version of numba by default
    "numpy>=2.4",
    "PySide6-Essentials==6.10.2",
]

[project.scripts]
dpdfnet-mic-bridge = "dpdfnet_mic_bridge.app:main"

[build-system]
requires = ["maturin==1.14.1"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "rust/native_audio/Cargo.toml"
bindings = "pyo3"
module-name = "dpdfnet_mic_bridge._native_audio"
python-source = "src"
features = ["pyo3/extension-module"]
include = [{ path = "src/dpdfnet_mic_bridge/assets/**/*", format = ["sdist", "wheel"] }]

[tool.basedpyright]
typeCheckingMode = "standard"

[tool.black]
target-version = ["py312"]

[dependency-groups]
bundle = [
    "patchelf==0.17.2.4; sys_platform == 'linux'",
    "pyinstaller==6.21.0",
    "pyinstaller-hooks-contrib==2026.6",
]
dev = [
    "basedpyright>=1.39.6",
    "black>=26.5.1",
    "isort>=8.0.1",
    "mypy>=2.1.0",
    "pytest>=9.0.0",
    "ruff>=0.15.15",
]
