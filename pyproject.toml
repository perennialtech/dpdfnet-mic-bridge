[project]
name = "dpdfnet-mic-bridge"
version = "0.5.0"
description = "Desktop DPDFNet microphone bridge for Windows and Linux"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    # Both wheels come from the perennialtech/DPDFNet v0.1.0 release.
    "dpdfnet-native @ https://github.com/perennialtech/DPDFNet/releases/download/v0.1.0/dpdfnet_native-0.1.0-py3-none-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl#sha256=3cd622b439c23825a4b1d95ba5c6f406ef139df03e40202c25f7dfca417f8e77 ; sys_platform == 'linux'",
    "dpdfnet-native @ https://github.com/perennialtech/DPDFNet/releases/download/v0.1.0/dpdfnet_native-0.1.0-py3-none-win_amd64.whl#sha256=6156432f2e33b6c4c5d82c98bbe0e07871461f26993bdcec99689f247701e121 ; sys_platform == 'win32'",
    "numba>=0.68.1", # Keep the current Numba floor for librosa.
    "numpy>=2.5.5",
    "PySide6-Essentials==6.12.0",
]

[project.scripts]
dpdfnet-mic-bridge = "dpdfnet_mic_bridge.app:main"

[build-system]
requires = ["maturin==1.16.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "rust/native_audio/Cargo.toml"
bindings = "pyo3"
module-name = "dpdfnet_mic_bridge._native_audio"
python-source = "src"
features = ["pyo3/extension-module"]

# Keep the lint rules used before Ruff 0.17 changed its defaults.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.basedpyright]
typeCheckingMode = "standard"

[tool.black]
target-version = ["py312"]

[dependency-groups]
bundle = [
    "patchelf==0.19.3.0; sys_platform == 'linux'",
    "pyinstaller==6.22.3",
    "pyinstaller-hooks-contrib==2026.10",
]
dev = [
    "basedpyright>=1.40.2",
    "black>=26.10.1",
    "isort>=9.0.2",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
